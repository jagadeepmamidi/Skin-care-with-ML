"""
Skincare Intelligence Data Platform
Local stack: Postgres, MinIO, Product API, Airflow, Streamlit, optional Redpanda.
"""

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://skincare:skincare@postgres:5432/skincare
    AIRFLOW__CORE__FERNET_KEY: "skincare_fernet_key_replace_in_prod_32b="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    LAKE_BACKEND: minio
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET: skincare-lake
    WAREHOUSE_BACKEND: duckdb
    DUCKDB_PATH: /opt/airflow/data/warehouse/skincare.duckdb
    PRODUCT_API_URL: http://product-api:8088
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./data_quality:/opt/airflow/data_quality
    - ./ml:/opt/airflow/ml
    - ./cosmetics.csv:/opt/airflow/cosmetics.csv:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare
      POSTGRES_DB: skincare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/schemas/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/skincare-lake || true;
      mc anonymous set download local/skincare-lake || true;
      exit 0;
      "

  product-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m skincare_platform.cli serve-api --host 0.0.0.0 --port 8088
    ports:
      - "8088:8088"
    environment:
      LAKE_BACKEND: local
    volumes:
      - ./cosmetics.csv:/app/cosmetics.csv:ro
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: streamlit run dashboards/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      DUCKDB_PATH: /app/data/warehouse/skincare.duckdb
    volumes:
      - ./data:/app/data
      - ./dashboards:/app/dashboards

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Skin --lastname Care --role Admin --email airflow@example.com || true"
    user: "0:0"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  redpanda:
    image: redpandadata/redpanda:v24.2.11
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
    ports:
      - "19092:19092"

volumes:
  postgres_data:
  minio_data:
