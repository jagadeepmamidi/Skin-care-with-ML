[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skincare-data-platform"
version = "1.0.0"
description = "Skincare Intelligence Data Platform — medallion lakehouse, dbt warehouse, and ML features"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jagadeep Mamidi" }]
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26",
  "pyarrow>=14.0",
  "pyspark>=3.5",
  "duckdb>=1.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "boto3>=1.34",
  "botocore>=1.34",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
dashboard = [
  "streamlit>=1.35",
  "plotly>=5.20",
]
streaming = [
  "confluent-kafka>=2.4",
]
dbt = [
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "dbt-postgres>=1.8",
]
all = [
  "skincare-data-platform[dev,dashboard,streaming,dbt]",
]

[project.scripts]
skincare-platform = "skincare_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "spark: tests that require a local Spark session",
  "integration: end-to-end pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "airflow", "spark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
