name: skincare_platform
version: "1.0.0"
config-version: 2
profile: skincare_platform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  skincare_platform:
    +on_schema_change: "sync_all_columns"
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

snapshots:
  skincare_platform:
    +target_schema: snapshots

vars:
  "dbt_date:time_zone": "UTC"
