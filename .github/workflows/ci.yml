name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package
        run: pip install -e ".[dev,dbt]"
      - name: Ruff
        run: python -m ruff check src tests airflow spark
      - name: Pytest
        run: python -m pytest -q tests
      - name: dbt compile
        run: |
          mkdir -p data/warehouse
          dbt compile --project-dir dbt --profiles-dir dbt || true
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/skincare.duckdb
      - name: Pipeline smoke test
        run: python -m skincare_platform.cli run-pipeline --events 4000 --price-days 10 --regenerate
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

  docker:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile -t skincare-platform:ci .
